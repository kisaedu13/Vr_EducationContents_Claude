<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <rect width="400" height="300" rx="12" fill="#FFF3E0"/>
  <rect x="20" y="20" width="360" height="210" rx="8" fill="#FFE0B2"/>
  <!-- 사람 1 (왼쪽) -->
  <circle cx="140" cy="90" r="20" fill="#42A5F5"/>
  <rect x="125" y="112" width="30" height="50" rx="6" fill="#42A5F5"/>
  <line x1="125" y1="130" x2="105" y2="155" stroke="#42A5F5" stroke-width="6" stroke-linecap="round"/>
  <line x1="155" y1="130" x2="175" y2="120" stroke="#42A5F5" stroke-width="6" stroke-linecap="round"/>
  <line x1="133" y1="162" x2="120" y2="200" stroke="#42A5F5" stroke-width="6" stroke-linecap="round"/>
  <line x1="147" y1="162" x2="160" y2="200" stroke="#42A5F5" stroke-width="6" stroke-linecap="round"/>
  <!-- 롤테이너 (가운데) -->
  <rect x="172" y="100" width="56" height="70" rx="3" fill="#BDBDBD" stroke="#9E9E9E" stroke-width="2"/>
  <circle cx="182" cy="178" r="8" fill="#795548"/>
  <circle cx="218" cy="178" r="8" fill="#795548"/>
  <!-- 사람 2 (오른쪽) -->
  <circle cx="280" cy="90" r="20" fill="#66BB6A"/>
  <rect x="265" y="112" width="30" height="50" rx="6" fill="#66BB6A"/>
  <line x1="265" y1="130" x2="245" y2="120" stroke="#66BB6A" stroke-width="6" stroke-linecap="round"/>
  <line x1="295" y1="130" x2="315" y2="155" stroke="#66BB6A" stroke-width="6" stroke-linecap="round"/>
  <line x1="273" y1="162" x2="260" y2="200" stroke="#66BB6A" stroke-width="6" stroke-linecap="round"/>
  <line x1="287" y1="162" x2="300" y2="200" stroke="#66BB6A" stroke-width="6" stroke-linecap="round"/>
  <!-- 충돌 표시 -->
  <text x="200" y="95" text-anchor="middle" font-size="36" fill="#D32F2F" font-family="Arial">⚡</text>
  <circle cx="200" cy="130" r="16" fill="#D32F2F" opacity="0.8">
    <animate attributeName="r" values="16;22;16" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="200" y="136" text-anchor="middle" font-size="18" font-weight="bold" fill="white" font-family="Arial">!</text>
  <!-- 라벨 -->
  <text x="200" y="265" text-anchor="middle" font-size="18" font-weight="bold" fill="#D32F2F" font-family="sans-serif">충돌 위험</text>
  <text x="200" y="288" text-anchor="middle" font-size="12" fill="#795548" font-family="sans-serif">다른 근로자와 부딪힐 수 있음</text>
</svg>
