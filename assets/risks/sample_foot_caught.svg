<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <rect width="400" height="300" rx="12" fill="#FFF3E0"/>
  <rect x="20" y="20" width="360" height="210" rx="8" fill="#FFE0B2"/>
  <!-- 롤테이너 바퀴 -->
  <circle cx="140" cy="180" r="25" fill="#795548" stroke="#5D4037" stroke-width="3"/>
  <circle cx="140" cy="180" r="8" fill="#8D6E63"/>
  <circle cx="260" cy="180" r="25" fill="#795548" stroke="#5D4037" stroke-width="3"/>
  <circle cx="260" cy="180" r="8" fill="#8D6E63"/>
  <!-- 롤테이너 몸체 -->
  <rect x="110" y="80" width="180" height="90" rx="4" fill="#BDBDBD" stroke="#9E9E9E" stroke-width="2"/>
  <line x1="110" y1="110" x2="290" y2="110" stroke="#9E9E9E" stroke-width="1.5"/>
  <line x1="110" y1="140" x2="290" y2="140" stroke="#9E9E9E" stroke-width="1.5"/>
  <!-- 발 -->
  <ellipse cx="155" cy="210" rx="30" ry="12" fill="#FFCC80" stroke="#F57C00" stroke-width="2"/>
  <!-- 위험 표시 -->
  <circle cx="155" cy="195" r="14" fill="#D32F2F" opacity="0.8">
    <animate attributeName="r" values="14;18;14" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="155" y="200" text-anchor="middle" font-size="16" font-weight="bold" fill="white" font-family="Arial">!</text>
  <!-- 라벨 -->
  <text x="200" y="265" text-anchor="middle" font-size="18" font-weight="bold" fill="#D32F2F" font-family="sans-serif">발끼임 위험</text>
  <text x="200" y="288" text-anchor="middle" font-size="12" fill="#795548" font-family="sans-serif">롤테이너 바퀴에 발이 끼일 수 있음</text>
</svg>
