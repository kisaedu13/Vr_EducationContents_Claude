<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <base href="/">
  <title>VR 안전교육 - 강사 모드</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- 0. 기관 에러 화면 -->
  <div id="org-error-screen" class="org-error-screen" style="display:none">
    <div class="org-error-card">
      <div class="org-error-icon">!</div>
      <h1 class="org-error-title"></h1>
      <p class="org-error-message"></p>
      <p class="org-error-detail"></p>
    </div>
  </div>

  <!-- 1. 세션 없음 에러 -->
  <div id="no-session-screen" class="org-error-screen" style="display:none">
    <div class="org-error-card">
      <div class="org-error-icon">!</div>
      <h1>활성 세션 없음</h1>
      <p class="org-error-message">현재 활성화된 교육 세션이 없습니다.<br>관리자에게 문의해주세요.</p>
      <p class="org-error-detail"></p>
    </div>
  </div>

  <!-- 2. 강사 VR 화면 -->
  <div id="instructor-vr-screen" class="vr-screen" style="display:none">
    <!-- 상단 바 -->
    <div class="vr-topbar">
      <div class="vr-topbar-left">
        <span id="org-name-display" class="org-badge"></span>
        <h2 id="scene-title">작업장</h2>
      </div>
      <div class="vr-topbar-right">
        <span class="instructor-badge">강사 모드</span>
        <button class="btn btn-scene" onclick="InstructorApp.toggleOverlay()">결과 패널</button>
        <button class="btn btn-scene" onclick="InstructorApp._refreshData()">새로고침</button>
      </div>
    </div>

    <!-- 씬 이동 -->
    <div class="scene-nav" id="scene-buttons"></div>

    <!-- krpano 뷰어 -->
    <div id="krpano-viewer"></div>

    <!-- 우측 결과 오버레이 패널 -->
    <div id="result-overlay" class="result-overlay">
      <div class="overlay-header">
        <h3>교육생 평가 결과</h3>
        <button class="overlay-close" onclick="InstructorApp.toggleOverlay()">&times;</button>
      </div>
      <div id="result-overlay-content" class="overlay-content"></div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/vtour/tour.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/krpano-interface.js"></script>
  <script src="/js/risk-assessment.js"></script>
  <script src="/js/supabase-client.js"></script>
  <script src="/js/org-context.js"></script>
  <script src="/js/instructor-app.js"></script>
</body>
</html>
